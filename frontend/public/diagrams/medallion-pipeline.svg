<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial" font-size="32" fill="#0f172a">Medallion Ingestion & Serving</text>
  <rect x="60" y="140" width="200" height="120" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="200" font-family="Arial" font-size="20" fill="#92400e">Bronze</text>
  <text x="80" y="230" font-family="Arial" font-size="12" fill="#92400e">Raw append-only</text>

  <rect x="310" y="140" width="200" height="120" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="360" y="200" font-family="Arial" font-size="20" fill="#0369a1">Silver</text>
  <text x="330" y="230" font-family="Arial" font-size="12" fill="#0369a1">Normalized per source</text>

  <rect x="560" y="140" width="200" height="120" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="620" y="200" font-family="Arial" font-size="20" fill="#4338ca">Gold</text>
  <text x="590" y="230" font-family="Arial" font-size="12" fill="#4338ca">Canonical entities</text>

  <rect x="810" y="140" width="200" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="850" y="200" font-family="Arial" font-size="20" fill="#166534">Serving</text>
  <text x="820" y="230" font-family="Arial" font-size="12" fill="#166534">App projections</text>

  <line x1="260" y1="200" x2="310" y2="200" stroke="#64748b" stroke-width="3"/>
  <line x1="510" y1="200" x2="560" y2="200" stroke="#64748b" stroke-width="3"/>
  <line x1="760" y1="200" x2="810" y2="200" stroke="#64748b" stroke-width="3"/>

  <text x="60" y="330" font-family="Arial" font-size="14" fill="#334155">Extractor writes to Bronze → Transformers rebuild Silver → Canonicalize to Gold → Publish Serving views.</text>
