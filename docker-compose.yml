version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: darkmoney
      POSTGRES_USER: darkmoney
      POSTGRES_PASSWORD: darkmoney
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    command: bash -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: darkmoney
      POSTGRES_USER: darkmoney
      POSTGRES_PASSWORD: darkmoney
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
